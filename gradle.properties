org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# aapt2 ships x86-64 only; this host is arm64, so route it through qemu.
# Harmless on x86 machines? No: the wrapper path is host-specific, so this
# property must be removed when building on a normal x86-64 machine.
android.aapt2FromMavenOverride=/tmp/aapt2-dir/aapt2
